<div class="container">
    <div class="error-code">404</div>
    <h1>Página não encontrada</h1>
    <p>A página que estás a procurar pode ter sido removida, alterada ou encontra-se temporariamente indisponível.</p>
    <a href="/" class="btn">Voltar ao Início</a>
    <br/>
    <div>
        <p class="timer-text">Redirecionando para a página inicial em <strong id="time">10</strong> segundos</p>
        <div class="progress-bar">
            <div id="progress" class="progress-fill" style="width: 100%"></div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var timeEl = document.getElementById('time');
        var progressEl = document.getElementById('progress');

        var totalSeconds = 1000;
        var remaining = totalSeconds;
        var tempo = 10;

        // Atualiza a cada segundo
        var interval = setInterval(function() {

            remaining--;
            if (remaining < 0) {
                clearInterval(interval);
                // Redireciona para a home
                window.location.href = '/';
                return;
            }




            if(remaining% 100 ==0){
                tempo = remaining/100;
            }

            // Atualiza o texto
            timeEl.textContent = tempo;

            // Atualiza a barra de progresso (percentual restante)
            var percent = (remaining / totalSeconds) * 100;
            progressEl.style.width = percent + '%';
        }, 10);
    });
</script>
</body>
